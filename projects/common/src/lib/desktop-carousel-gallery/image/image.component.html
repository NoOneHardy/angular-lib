<div class="image" *ngIf="image" [routerLink]="image.link">
  <img [ngSrc]="image.src" height="1" width="1" alt img>
  <div class="content">
    <h1>{{ image.name }}</h1>
    <span>{{ image.desc }}</span>
    <span class="link">Weiter Bilder <span class="material-icons">arrow_forward</span></span>
  </div>
</div>
