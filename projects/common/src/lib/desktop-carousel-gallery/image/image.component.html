<div class="image" *ngIf="image" [routerLink]="image.link">
  <img [ngSrc]="image.src" height="1" width="1" alt img>
  <div class="content">
    <h1>{{ image.name }}</h1>
    <span *ngIf="date">{{ date | date:'dd.MM.yyyy' }}</span>
    <span *ngIf="!date">{{ image.desc }}</span>
    <span class="link">
      Weiter Bilder
      <span class="material-icons">arrow_forward</span>
      <span class="hover"></span>
    </span>
  </div>
</div>
