name: 'Verify project'
on:
  push:
    branches-ignore:
      - release
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Setup pnpm'
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Test project'
        run: pnpm run test:ci
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Setup pnpm'
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Lint project'
        run: pnpm run lint
  build:
    needs: [ test, lint ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Setup pnpm'
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Build common library'
        run: pnpm run build:common
      - name: 'Build example'
        run: pnpm run build:example



