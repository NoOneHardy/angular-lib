name: 'Storybook: @no1hardy/angular-common'
on:
  push:
jobs:
  docker:
    name: 'Build and Publish (Docker)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Login to registry'
        uses: docker/login-action@v3
        with:
          registry: docker.no1hardy.ch
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 'Collect image metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.no1hardy.ch/${{ github.repository }}/storybook-angular-common
          tags: |
            type=ref,event=branch
            type=sha
      - name: 'Build image (push on release)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./projects/common/Dockerfile
          push: ${{ github.ref == 'refs/heads/release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
  pages:
    name: 'Build and Deploy (GitHub Pages)'
    runs-on: ubuntu-latest
    permissions:
        contents: read
        pages: write
        id-token: write
    environment:
      name: 'GitHub Pages'
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Setup pnpm'
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Build'
        run: pnpm run storybook:build
      - name: 'Setup pages'
        uses: actions/configure-pages@v5
      - name: 'Upload artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v5
