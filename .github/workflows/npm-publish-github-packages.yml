# This workflow will run tests using node and then publish a package to the private npm registry when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: publish common library

on:
  push:
    branches:
      - develop
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-common
      - name: Publish package
        run: |
          echo "@no1hardy:registry=http://no1hardy.ch:4873/" >> .npmrc
          echo "//no1hardy.ch:4873/:_auth=$(printf '%s:%s' "$NPM_REGISTRY_USERNAME" "$NPM_REGISTRY_PASSWORD" | base64 -w0)" >> .npmrc
          cd ./dist/common
          pnpm publish --no-git-checks
        env:
          NPM_REGISTRY_USERNAME: ${{ secrets.NPM_REGISTRY_USERNAME }}
          NPM_REGISTRY_PASSWORD: ${{ secrets.NPM_REGISTRY_PASSWORD }}
